name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        shell: bash
        env:
          CLASS_REG_DB: ci.db
          CLASS_REG_SESSION_FILE: ci-session.json
        run: |
          echo adminpw | class-reg admin add A1 root Ada Admin
          echo adminpw | class-reg login root
          class-reg course add CS101 "Intro to Programming" --capacity 1
          echo secret | class-reg student add S1 alice Alice Smith
          echo secret | class-reg login alice
          class-reg register CS101
          if class-reg course add CS102 "Not allowed"; then exit 1; fi
          echo adminpw | class-reg login root
          class-reg course show CS101 | grep -q "S1  Alice Smith"
